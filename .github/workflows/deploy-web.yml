# Deploys the PWA as a project page of the user site treehopper.github.io, which has the
# custom domain www.hohenegger.eu → https://www.hohenegger.eu/<repository name>/ (README §4.11).
# configure-pages reports the base path (e.g. "/annuity"); the build derives the Expo baseUrl,
# manifest start_url/scope/id and the service worker scope from it (scripts/base-path.cjs).
# Runs on pushes to develop: the github-pages environment only accepts deployments from the
# default branch unless further branches or tags are allowed in its protection rules.
name: deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v7

      - id: pages
        uses: actions/configure-pages@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Boundary rules, core and golden tests must pass before deploying (§4.2).
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # expo export -p web, then 404.html, .nojekyll and the service worker (Q9)
      - name: Build
        run: npm run build:web
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: E2E tests
        run: npm run e2e
        env:
          CI: true
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
